<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案目錄入口</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-hover: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-main);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 4rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            text-decoration: none;
            color: var(--text-main);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card:hover {
            transform: translateY(-8px);
            background: var(--card-hover);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .card-content {
            flex-grow: 1;
            padding-right: 15px;
        }
        .card h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 500;
            word-break: break-all;
        }
        .card p.desc {
            margin: 0.5rem 0 0 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .icon {
            background: rgba(255,255,255,0.08);
            min-width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--accent);
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }
        .card:hover .icon {
            transform: translateX(5px);
            background: rgba(56, 189, 248, 0.2);
            color: #fff;
        }
        .empty-state {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed var(--card-border);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>專案目錄入口</h1>
            <p class="subtitle">目前共偵測到 2 個專案</p>
        </header>
        <div class="grid">
            <a href="data mermaid/index.html" class="card">
                <div class="card-content">
                    <h2>data mermaid</h2>
                    <p class="desc">資料庫架構圖</p>
                </div>
                <div class="icon">➔</div>
            </a>
            <a href="oceanAI/index.html" class="card">
                <div class="card-content">
                    <h2>oceanAI</h2>
                    <p class="desc">API數據整理</p>
                </div>
                <div class="icon">➔</div>
            </a>
        </div>
    </div>
</body>
</html>
